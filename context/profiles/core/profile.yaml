title: Design Core
description: >-
  Umbrella profile for user-facing surface design: framework-agnostic
  design principles grounded in ISO 9241-110, visual language, an
  abstract component taxonomy, and the design process, which medium
  profiles (web, documents, and future ones such as ios or cli) and
  brand profiles specialize.
packages:
